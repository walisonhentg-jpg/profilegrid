name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Electron packager
        run: npm install --no-save --legacy-peer-deps electron electron-builder

      - name: Build frontend & server bundle
        run: |
          npm run build
          npx esbuild server.ts --bundle --platform=node --format=cjs --outfile=dist-server/server.cjs --external:vite --external:@tailwindcss/vite --external:lightningcss --external:playwright-core

      - name: Build Windows EXE
        run: npx electron-builder --config desktop/electron-builder.yml --win --publish never

      - name: Upload Windows EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProfileGrid-Windows-EXE
          path: dist-desktop/*.exe
